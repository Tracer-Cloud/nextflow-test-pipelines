name: "Install Tracer Client"
author: "Vaibhav Upreti"
description: "Installs Tracer Client"

branding:
  color: "blue"
  icon: "activity"

inputs:
  tracer_user_id:
    description: "Tracer User ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: "Install Tracer Client"
      shell: bash
      run: |
        set -e
        if [ -n "${{ inputs.tracer_user_id }}" ]; then
          export TRACER_USER_ID="${{ inputs.tracer_user_id }}"
        fi

        # Detect OS and Distro
        if [ "$RUNNER_OS" = "Linux" ]; then
          if grep -qi 'ubuntu' /etc/os-release; then
            TRACER_PATH="/root/.tracerbio/bin"
            curl -sSL https://install.tracer.cloud | bash
          else
            TRACER_PATH="/root/.tracerbio/bin"
            curl -sSL https://install.tracer.cloud |  bash
            sudo chmod -R a+rx /root/.tracerbio
          fi
        elif [ "$RUNNER_OS" = "macOS" ]; then
          TRACER_PATH="$HOME/.tracerbio/bin"
          curl -sSL https://install.tracer.cloud |  bash
          sudo chmod -R a+rx "$HOME/.tracerbio"
        else
          echo "Unsupported OS: $RUNNER_OS"
          exit 1
        fi

        echo "TRACER_PATH=$TRACER_PATH" >> $GITHUB_ENV
        echo "$TRACER_PATH" >> $GITHUB_PATH
        echo "PATH after install: $TRACER_PATH:$PATH"
        ls -l "$TRACER_PATH/tracer" || true
        which tracer || true
        tracer --version || true

    - name: "Verify Tracer Client"
      shell: bash
      run: |
        echo "PATH in verify step: $PATH"
        echo "TRACER_PATH in verify step: $TRACER_PATH"
        which tracer || true
        ls -l "$TRACER_PATH/tracer" || true
        tracer info
