name: "Install Tracer Client"
author: "Vaibhav Upreti"
description: "Installs Tracer Client"

branding:
  color: "blue"
  icon: "activity"

inputs:
  tracer_user_id:
    description: "Tracer User ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: "Install Tracer Client"
      shell: bash
      run: |
        set -e
        if [ -n "${{ inputs.tracer_user_id }}" ]; then
          export TRACER_USER_ID="${{ inputs.tracer_user_id }}"
        fi

        # Install tracer binary (do not export PATH or move binary)
        curl -sSL https://install.tracer.cloud | sh && source ~/.bashrc && source ~/.zshrc

        echo "PATH after patch: $PATH"
        which tracer || { echo "❌ tracer not found in PATH"; exit 1; }
        tracer --version

    - name: "Verify Tracer Installation"
      shell: bash
      run: |
        echo "PATH after install: $PATH"
        echo "TRACER_PATH: $TRACER_PATH"

        # Check if tracer binary exists
        if [ -f "$TRACER_PATH/tracer" ]; then
          echo "✅ Tracer binary found at $TRACER_PATH/tracer"
          ls -l "$TRACER_PATH/tracer"
        else
          echo "❌ Tracer binary not found at $TRACER_PATH/tracer"
          exit 1
        fi

        # Test tracer command
        echo "Testing tracer --version:"
        tracer --version || {
          echo "❌ tracer --version failed"
          echo "Current PATH: $PATH"
          which tracer || echo "tracer not found in PATH"
          exit 1
        }

    - name: "Verify Tracer Client"
      shell: bash
      run: |
        echo "PATH in verify step: $PATH"
        echo "TRACER_PATH in verify step: $TRACER_PATH"

        # Additional verification
        which tracer || {
          echo "❌ tracer command not found in PATH"
          exit 1
        }

        echo "✅ Tracer is available in PATH"
        tracer info
