name: "Install Tracer Client"
author: "Vaibhav Upreti"
description: "Installs Tracer Client"

branding:
  color: "blue"
  icon: "activity"

inputs:
  tracer_user_id:
    description: "Tracer User ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: "Install Tracer Client"
      shell: bash
      run: |
        set -e
        if [ -n "${{ inputs.tracer_user_id }}" ]; then
          export TRACER_USER_ID="${{ inputs.tracer_user_id }}"
        fi

        curl -sSL https://install.tracer.cloud | sh

    - name: "Set Tracer PATH"
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
           echo "/root/.tracerbio/bin" >> $GITHUB_PATH
           echo 'export PATH="/root/.tracerbio/bin:$PATH"' >> ~/.bashrc
           export PATH="/root/.tracerbio/bin:$PATH"
           source ~/.bashrc
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "$HOME/.tracerbio/bin" >> $GITHUB_PATH
          echo 'export PATH="$HOME/.tracerbio/bin:$PATH"' >> ~/.zshrc
          export PATH="$HOME/.tracerbio/bin:$PATH"
          source ~/.zshrc
        fi

    - name: "Debug PATH and GITHUB_PATH"
      shell: bash
      run: |
        echo "Current PATH: $PATH"
        echo "Contents of GITHUB_PATH file:"
        cat $GITHUB_PATH

    - name: "Verify Tracer Installation"
      shell: bash
      run: |
        sudo tracer --version
