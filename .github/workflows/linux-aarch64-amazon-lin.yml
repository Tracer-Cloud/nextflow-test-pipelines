name: Nextflow Linux ARM64 Amazon Linux Pipelines

on:
  workflow_dispatch:
  push:
    paths:
      - "pipelines/linux-arm-amazon-linux/**"
      - ".github/workflows/linux-aarch64-amazon-lin.yml"
      - ".github/actions/verify-tracer/action.sh"
  schedule:
    - cron: "0 11 * * *"

jobs:
  linux-arm64-amazon-pixi:
    name: Pixi Pipeline
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline in Amazon Linux Docker container
        run: |
          docker run --rm \
            --name tracer \
            --privileged \
            --pid=host \
            -v /lib/modules:/lib/modules:ro \
            -v /usr/src:/usr/src:ro \
            -v /sys/kernel/debug:/sys/kernel/debug:rw \
            -v /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            -e GITHUB_WORKSPACE=/workspace \
            -e GITHUB_SHA="${{ github.sha }}" \
            -e GITHUB_REF_NAME="${{ github.ref_name }}" \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -c "
              # Install system dependencies
              yum update -y
              yum install -y wget git bash which tar gzip curl --allowerasing

              # Install tracer
              curl -sSL https://install.tracer.cloud | sh
              # Run tracer init
              tracer init --pipeline-name github-actions \
              --environment github-actions \
              --user-id github-actions \
              --pipeline-type nextflow \
              --tags 'github-actions,amazon-linux,arm64'
              
              # Run pipeline with Pixi
              cd pipelines/linux-arm-amazon-linux/nextflow-pixi/
              ./run.sh

              cd ../../../
              chmod +x .github/actions/verify-tracer/action.sh
              .github/actions/verify-tracer/action.sh
            "

      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixi-linux-arm64-amazon-pipeline-results
          path: |
            pipelines/linux-arm-amazon-linux/nextflow-pixi/results/
            pipelines/linux-arm-amazon-linux/nextflow-pixi/logs/
          retention-days: 7

  linux-arm64-amazon-conda:
    name: Conda Pipeline
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline in Amazon Linux Docker container
        run: |
          docker run --rm \
            --name tracer \
            --privileged \
            --pid=host \
            -v /lib/modules:/lib/modules:ro \
            -v /usr/src:/usr/src:ro \
            -v /sys/kernel/debug:/sys/kernel/debug:rw \
            -v /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            -e GITHUB_WORKSPACE=/workspace \
            -e GITHUB_SHA="${{ github.sha }}" \
            -e GITHUB_REF_NAME="${{ github.ref_name }}" \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -c "
              # Install system dependencies
              yum update -y
              yum install -y wget git bash which bzip2 tar gzip curl --allowerasing

              # Install tracer
              curl -sSL https://install.tracer.cloud | sh
              source ~/.bashrc

              # Run tracer init
              tracer init --pipeline-name github-actions --environment github-actions --user-id github-actions --pipeline-type nextflow

              # Run pipeline with Conda
              cd pipelines/linux-arm-amazon-linux/nextflow-conda
              ./run.sh


              echo '=== Verifying tracer packages ==='
              cd ../../../
              chmod +x .github/actions/verify-tracer/action.sh
              .github/actions/verify-tracer/action.sh

            "
      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conda-linux-arm64-amazon-pipeline-results
          path: |
            pipelines/linux-arm-amazon-linux/nextflow-conda/results/
            pipelines/linux-arm-amazon-linux/nextflow-conda/logs/
          retention-days: 7
