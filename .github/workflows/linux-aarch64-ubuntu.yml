name: Linux aarch64 Ubuntu pipelines

on:
  workflow_dispatch:
  push:
    paths:
      - "pipelines/linux-arm-ubuntu/**"
      - "pipelines/shared/fastquorum/**"
      - ".github/workflows/linux-aarch64-ubuntu.yml"
      - ".github/actions/verify-tracer/action.yml"
      - ".github/actions/install-tracer/action.yml"
  schedule:
    - cron: "0 11 * * *"

jobs:
  fastquorum:
    name: Fastquorum Linux aarch64 Ubuntu
    runs-on: ubuntu-24.04-arm
    env:
      NXF_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRACER_USER_ID: ${{ secrets.TRACER_USER_ID }}
      TRACER_TOKEN: ${{ secrets.TRACER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tracer
        run: |
          curl -sSL https://install.tracer.cloud | CLI_BRANCH=dev sh -s ${{ secrets.TRACER_USER_ID }}

      - name: Run tracer init
        run: |
          sudo tracer init --token ${{ secrets.TRACER_TOKEN }}

      - name: Run pipeline with Pixi
        working-directory: pipelines/linux-arm-ubuntu/fastquorum
        run: |
          bash ./run.sh

      - name: Verify tracer packages
        uses: ./.github/actions/verify-tracer
        with:
          is_ebpf: true
          use_sudo: true
          binary: tracer
          required_processes_ebpf: "multiqc, samtools dict, bwa index, samtools fastq, FastQC, samtools sort, samtools faidx"

      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastquorum-linux-aarch64-ubuntu-pipeline-results
          path: |
            pipelines/linux-arm-ubuntu/fastquorum/results/
            pipelines/linux-arm-ubuntu/fastquorum/logs/
          retention-days: 7

  linux-arm64-pixi:
    name: Pixi Pipeline
    runs-on: ubuntu-24.04-arm
    env:
      TRACER_BIO: /root/.tracerbio/bin/tracer
      TRACER_USER_ID: ${{ secrets.TRACER_USER_ID }}
      TRACER_TOKEN: ${{ secrets.TRACER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tracer
        run: |
          curl -sSL https://install.tracer.cloud | CLI_BRANCH=dev sh -s ${{ secrets.TRACER_USER_ID }}

      - name: Run tracer init
        run: |
          sudo tracer init --token ${{ secrets.TRACER_TOKEN }}

      - name: Run pipeline with Pixi
        working-directory: pipelines/linux-arm-ubuntu/nextflow-pixi
        run: |
          bash ./run.sh

      - name: Verify tracer packages
        uses: ./.github/actions/verify-tracer
        with:
          is_ebpf: true
          use_sudo: true
          binary: tracer

      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixi-linux-arm64-pipeline-results
          path: |
            pipelines/linux-arm-ubuntu/nextflow-pixi/results/
          retention-days: 7

  linux-arm64-conda:
    name: Conda Pipeline
    runs-on: ubuntu-24.04-arm
    env:
      TRACER_BIO: /root/.tracerbio/bin/tracer
      TRACER_USER_ID: ${{ secrets.TRACER_USER_ID }}
      TRACER_TOKEN: ${{ secrets.TRACER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tracer
        run: |
          curl -sSL https://install.tracer.cloud | CLI_BRANCH=dev sh -s ${{ secrets.TRACER_USER_ID }}

      - name: Run tracer init
        run: |
          sudo tracer init --token ${{ secrets.TRACER_TOKEN }}
      - name: Run pipeline with Conda
        working-directory: pipelines/linux-arm-ubuntu/nextflow-conda
        run: |
          bash ./run.sh

      - name: Verify tracer packages
        uses: ./.github/actions/verify-tracer
        with:
          is_ebpf: true
          use_sudo: true
          binary: tracer

      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conda-linux-arm64-pipeline-results
          path: |
            pipelines/linux-arm-ubuntu/nextflow-conda/results/
          retention-days: 7
