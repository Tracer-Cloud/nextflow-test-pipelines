name: AWS Batch RNA-Seq

on:
  workflow_dispatch:

jobs:
  aws-batch-rnaseq:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up AWS CLI using OIDC
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_OIDC_ROLE_NAME }}
          role-session-name: aws-batch-rnaseq
          aws-region: us-east-1

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v1
      - name: Run pipeline
        run: |
          cd pipelines/aws-batch/rnaseq
          ./run.sh tracer run
