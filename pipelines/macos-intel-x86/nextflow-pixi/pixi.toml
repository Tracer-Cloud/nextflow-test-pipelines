[workspace]
name = "nextflow-minimal-pixi-intel"
description = "Minimal Nextflow pipeline using Pixi for dependency management (Intel x86)"
version = "1.0.0"
authors = ["Tracer Bioinformatics Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-64"]

[dependencies]
fastqc = "0.12.*"
star = "2.7.11b"
coreutils = "9.1.*"
bc = "*"
tree = "*"
nextflow = ">=25.4.4,<26"

[tasks]
pipeline = "nextflow -log logs/nextflow.log run main.nf"
clean = "rm -rf results logs work test_results custom_results .nextflow*"

[feature.dev.dependencies]
nextflow = ">=24.10.0"

[environments]
default = ["dev"]
