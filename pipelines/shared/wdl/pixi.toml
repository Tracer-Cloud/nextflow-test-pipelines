[project]
name = "tracer-wdl"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
python = "3.11.*"
miniwdl = "*"
samtools = "*"
star = "*"
fastqc = "*"
gffread = "*"
picard = "*"
openjdk = "*"
importlib_metadata = "<5"


[tasks]

script = "bash run.sh"
pipeline = "bash run.sh"
pipeline_wdl = "MINIWDL__DOCKER__RUN_OPTIONS='--privileged' miniwdl run tracer_wdl_minimal.wdl -i tracer_wdl_minimal.inputs.json > /dev/null"
setup = "bash docker-setup.sh"
