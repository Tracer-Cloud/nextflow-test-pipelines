[workspace]
name = "nextflow-minimal-pixi-linux-x86"
description = "Minimal Nextflow pipeline using Pixi for dependency management (Linux x86-64)"
version = "1.0.0"
authors = ["Tracer Bioinformatics Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
nextflow = "24.10.0"
openjdk = "17.0.11"
python = "3.12"

grep = "*"
tar = "*"
coreutils = "*"
findutils = "*"

fastqc = "0.12.1"
star = "*"
samtools = "1.21"
bwa = "*"

[tasks]
pipeline = "nextflow -log logs/nextflow.log run main.nf --outdir results"
clean = "rm -rf results logs work test_results custom_results .nextflow*"

[feature.dev.dependencies]
nextflow = ">=24.10.0"

[environments]
default = ["dev"] 