[workspace]
name = "nextflow-minimal-pixi"
description = "Minimal Nextflow pipeline using Pixi for dependency management"
version = "1.0.0"
authors = ["Tracer Bioinformatics Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64"]

[dependencies]
nextflow = ">=25.4.4,<26"
openjdk = "17.0.11.*"
python = "3.12.*"
grep = "*"
tar = "*"
coreutils = "*"
findutils = "*"
fastqc = "0.12.1.*"
star = "*"
samtools = "1.21.*"
bwa = "*"

[tasks]
pipeline = "nextflow -log logs/nextflow.log run main.nf --outdir results"
test = "nextflow -log logs/nextflow.log run main.nf --outdir test_results"
clean = "rm -rf results logs work test_results custom_results .nextflow*"

[feature.dev.dependencies]
nextflow = ">=24.10.0"

[environments]
default = ["dev"]
