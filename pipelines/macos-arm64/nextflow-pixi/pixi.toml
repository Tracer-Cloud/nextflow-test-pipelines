[workspace]
name = "nextflow-minimal-pixi"
description = "Minimal Nextflow pipeline using Pixi for dependency management"
version = "1.0.0"
authors = ["Tracer Bioinformatics Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64"]

[dependencies]
nextflow = ">=25.4.4,<26"
coreutils = "9.1.*"
bedtools = "*"
star = "*"
samtools = "*"
bc = "*"
multiqc = "*"

[tasks]
pipeline = "nextflow -log logs/nextflow.log run main.nf --outdir results"
clean = "rm -rf results logs work test_results custom_results .nextflow*"

[feature.dev.dependencies]
nextflow = ">=24.10.0"

[environments]
default = ["dev"]
